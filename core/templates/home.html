{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Research Conclave Evaluation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-4">
<div class="card p-4 shadow">

<h4 class="text-center mb-4">📄 Research Conclave Evaluation</h4>
<div class="d-flex justify-content-end mb-3">

<form method="post" action="{% url 'logout' %}">
{% csrf_token %}
<button type="submit" class="btn btn-danger">
Logout
</button>
</form>

</div>
<form method="POST" id="feedbackForm">
    {% csrf_token %}
    
    <label class="fw-semibold">Select Paper</label>
    <select id="paperSelect" name="paper_id" class="form-select mb-3" required onchange="this.form.submit()">
<option value="">-- Select Paper --</option>

{% for paper in papers %}
<option value="{{ paper.id }}"
data-url="{{ paper.file.url|cut:'http:' }}"
{% if selected_paper and paper.id == selected_paper.id %}selected{% endif %}>
{{ paper.file.url }}
</option>
{% endfor %}

</select>
    <input type="hidden" name="project_id" id="projectId">
    <div id="paperContainer" class="mb-4 d-none">
        <iframe id="paperFrame"
                style="width:100%; height:400px; border-radius:10px;">
        </iframe>
    </div>
    <div id="ratingSection" class="row g-3 d-none">
<h6>Evaluator Details</h6>
    <input name="name" class="form-control mb-2" placeholder="Name" required>
    <input name="id" class="form-control mb-2" placeholder="Employee Id" required>
    <input name="designation" class="form-control mb-3" placeholder="Designation">
    <div class="col-md-6">
        <input name="abstract" type="number" min="0" max="10" step="1"
               class="form-control"
               placeholder="Abstract, Introduction & Objective (Max 10)" required>
    </div>

    <div class="col-md-6">
        <input name="methodology" type="number" min="0" max="10" step="1"
               class="form-control"
               placeholder="Research Methodology (Max 10)" required>
    </div>

    <div class="col-md-6">
        <input name="results" type="number" min="0" max="10" step="1"
               class="form-control"
               placeholder="Results & Discussion (Max 10)" required>
    </div>

    <div class="col-md-6">
        <input name="formatting" type="number" min="0" max="10" step="1"
               class="form-control"
               placeholder="Formatting (Max 10)" required>
    </div>

    <div class="col-md-6">
        <input name="conclusion" type="number" min="0" max="10" step="1"
               class="form-control"
               placeholder="Conclusion (Max 10)" required>
    </div>

</div>
    <button id="submitBtn" class="btn btn-primary mt-4 d-none">
        Submit Feedback
    </button>
</form>

</div>

</div>
</div>

</div>
<script>
const paperSelect = document.getElementById('paperSelect');
const paperContainer = document.getElementById('paperContainer');
const paperFrame = document.getElementById('paperFrame');
const ratingSection = document.getElementById('ratingSection');
const submitBtn = document.getElementById('submitBtn');
const feedbackForm = document.getElementById('feedbackForm');
paperSelect.addEventListener('change', function() {

    const selectedOption = this.options[this.selectedIndex];
    const paperId = selectedOption.value;
    const fileUrl = selectedOption.getAttribute("data-url");

    document.getElementById('projectId').value = paperId;

    if (paperId) {

        paperFrame.src = fileUrl;   // load PDF in iframe

        paperContainer.classList.remove('d-none');
        ratingSection.classList.remove('d-none');
        submitBtn.classList.remove('d-none');

    } else {

        paperContainer.classList.add('d-none');
        ratingSection.classList.add('d-none');
        submitBtn.classList.add('d-none');

        paperFrame.src = ""; // clear iframe

    }

});
window.addEventListener("load", function(){

const paperSelect = document.getElementById("paperSelect");

if(paperSelect.value){

const option = paperSelect.options[paperSelect.selectedIndex];
const url = option.getAttribute("data-url");

document.getElementById("paperFrame").src = url;

document.getElementById("paperContainer").classList.remove("d-none");
document.getElementById("ratingSection").classList.remove("d-none");
document.getElementById("submitBtn").classList.remove("d-none");

}

});
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
